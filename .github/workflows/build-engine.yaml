name: Build Flutter Engine with Engine Tool (Matrix)

on:
  push:
    branches: [ "main", "engine-builds" ]
  pull_request:
    branches: [ "main", "engine-builds" ]

jobs:
  build-engine:
    # We'll run on whatever OS the matrix entry specifies.
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        include:
          # ------------------------- LINUX BUILDS -------------------------

          - name: Linux linux_host_desktop_engine
            config_name: linux_host_desktop_engine
            os: ubuntu-latest

          - name: Linux linux_android_aot_engine
            config_name: linux_android_aot_engine
            os: ubuntu-latest

          - name: Linux linux_web_engine
            config_name: linux_web_engine
            os: ubuntu-latest


          # ------------------------- MAC BUILDS -------------------------
          - name: Mac mac_host_engine
            config_name: mac_host_engine
            os: macos-latest

          - name: Mac mac_unopt
            config_name: mac_unopt
            os: macos-latest

          - name: Mac mac_ios_engine
            config_name: mac_ios_engine
            os: macos-latest

          # ------------------------- WINDOWS BUILDS -------------------------

          - name: Windows windows_host_engine
            config_name: windows_host_engine
            os: windows-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v3

      - name: Install Dependencies (Example for Linux)
        if: startsWith(matrix.build.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            clang \
            cmake \
            ninja-build \
            python3 \
            unzip \
            zip \
            xz-utils \
            libgtk-3-dev \
            libglu-dev

      - name: Install Dependencies (Example for macOS)
        if: startsWith(matrix.build.os, 'macos')
        run: |
          brew update
          brew install \
            cmake \
            ninja \
            python3

      - name: Install Dependencies (Example for Windows)
        if: startsWith(matrix.build.os, 'windows')
        run: |
          choco install -y \
            cmake \
            ninja \
            python3



      - name: Set up depot_tools / gclient
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git $HOME/depot_tools
          # Append depot_tools to the PATH for subsequent steps
          echo "$HOME/depot_tools" >> $GITHUB_PATH

      - name: Gclient Sync
        run: |
          # Example: place your .gclient or standard.gclient
          cp engine/scripts/standard.gclient .gclient
          gclient sync -D

      - name: Fetch engine dependencies
        run: |
          cd engine/src
          ./flutter/bin/et fetch

      - name: Build Engine
        run: |
          echo "Building config: ${{ matrix.build.config_name }}"
          cd engine/src
          ./flutter/bin/et build --config ${{ matrix.build.config_name }}
