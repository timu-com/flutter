name: Build Flutter Engine with Engine Tool

on:
  # Run on push or pull requests, modify to your needs.
  push:
    branches: [ "main", "engine-builds" ]
  pull_request:
    branches: [ "main", "engine-builds" ]

jobs:
  build-engine:
    runs-on: ubuntu-latest-large
    steps:
      - name: Check out the repository
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          # Typical dependencies for building the engine on Linux:
          sudo apt-get install --no-install-recommends -y \
            clang \
            cmake \
            ninja-build \
            python3 \
            unzip \
            zip \
            xz-utils \
            libgtk-3-dev \
            libglu-dev

      - name: Fetch engine dependencies
        run: |
          # If your engine checkout is in `./src`, navigate there first:
          cd engine/src
          ./flutter/tools/engine_tool/bin/et fetch

      - name: Build host_debug engine
        run: |
          cd engine/src
          # Example: build a host_debug engine for the local OS (Linux x64).
          ./flutter/tools/engine_tool/bin/et build --config host_debug

      # Optionally: run a sample C++ test target
      - name: Run C++ unit tests
        run: |
          cd engine/src
          ./flutter/tools/engine_tool/bin/et test //flutter/impeller:impeller_unittests